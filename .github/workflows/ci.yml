name: Java EE Web CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Executar Testes e Gerar WAR
        run: ./gradlew test war

      - name: Publicar Pacote WAR como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: game-store-war
          path: build/libs/*.war
